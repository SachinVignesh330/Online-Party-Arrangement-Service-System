spring:
  application:
    name: eventbridge-booking

  datasource:
    url: jdbc:postgresql://localhost:5432/eventbridge
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate          # schema already exists from the dump
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080

logging:
  level:
    com.eventbridge.booking: INFO
