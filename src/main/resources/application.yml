spring:
  application:
    name: eventbridge-user-management

  datasource:
    url: jdbc:postgresql://localhost:5432/eventbridge
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  jwt:
    secret: ${JWT_SECRET:c2VjdXJlLWV2ZW50YnJpZGdlLXVzZXItbWFuYWdlbWVudC1zZWNyZXQta2V5LWJhc2U2NA==}
    expiration-ms: 86400000

# Port 8081 so this can run alongside the Booking module on 8080
server:
  port: 8081

logging:
  level:
    com.eventbridge.user: INFO
